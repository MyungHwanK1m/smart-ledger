name: Supabase Keep-Alive Ping

on:
  schedule:
    # 매 3일마다 자정(00:00 UTC)에 자동 실행하여 7일 비활성화 방지
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 수동 실행 트리거

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -s -X GET "https://uyafrivmhhyzicbnkhet.supabase.co/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_kAi4vM-5sUepIFbvX-UGXw_B7P8woef' }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_kAi4vM-5sUepIFbvX-UGXw_B7P8woef' }}"
          echo "Supabase Keep-Alive ping successfully sent!"
