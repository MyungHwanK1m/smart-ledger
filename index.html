<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="스마트가계부" />
    <meta name="description" content="스마트 원격 가계부 - 모바일 간편 입력 및 PC 종합 대시보드" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./pwa-192x192.png" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <title>스마트 원격 가계부 | Smart Ledger</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.log('SW registration note: ', err);
          });
        });
      }
    </script>
  </body>
</html>
